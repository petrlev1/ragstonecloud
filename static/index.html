<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Облако</title>
<style>
  :root{
    --accent:#1f6feb; --border:#d9dde3; --bg:#f7f8fa; --muted:#6a737d;
    --text:#1f2328; --danger:#d1242f;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
  .hidden{display:none!important}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700;white-space:nowrap}
  .crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:150px;overflow-x:auto;white-space:nowrap}
  .crumbs a{color:var(--accent);text-decoration:none;padding:2px 4px;border-radius:4px}
  .crumbs a:hover{background:#e8f0fe}
  .crumbs .sep{color:var(--muted)}
  #q{min-width:180px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font:inherit}
  select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;font:inherit;color:var(--text);max-width:190px}
  #diskInfo{white-space:nowrap}
  button{font:inherit;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer}
  button:hover{background:#f0f2f5}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  main{max-width:1100px;margin:0 auto;padding:14px 16px 80px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #eceff2;vertical-align:middle}
  th{background:#f2f4f7;color:#57606a;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tbody tr:hover{background:#f6f9fe}
  .num{text-align:right;white-space:nowrap}
  /* сортировка: клик по заголовку столбца — ↑ / ↓ / по умолчанию */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--accent);background:#e8f0fe}
  th.sortable.on{color:var(--accent)}
  th.sortable .ar{font-size:10px;margin-left:5px}
  .nm{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;cursor:pointer;overflow-wrap:anywhere}
  .nm:hover{color:var(--accent)}
  .nm .ic{font-size:16px}
  .sub{color:var(--muted);font-size:12px;margin-left:24px;overflow-wrap:anywhere}
  .acts{display:flex;gap:6px;justify-content:flex-end}
  .acts button,.acts a{font-size:12px;padding:3px 8px;text-decoration:none;display:inline-block;line-height:1.5}
  .acts a{color:var(--text);border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer}
  .acts a:hover{background:#f0f2f5}
  .acts .del{color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .note{padding:8px 12px;margin:10px 0;background:#fff8e1;border:1px solid #f0df9a;border-radius:6px}
  #prog{position:fixed;left:0;right:0;bottom:0;height:4px;background:transparent;z-index:50}
  #prog .bar{height:100%;width:0;background:var(--accent);transition:width .2s}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24292f;color:#fff;padding:10px 18px;border-radius:8px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw}
  #toast.err{background:var(--danger)}
  /* вход */
  #login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:28px}
  #login h1{margin:0 0 4px;font-size:22px}
  #login p{margin:0 0 16px;color:var(--muted)}
  #login input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;margin-bottom:10px}
  #login .err{color:var(--danger);min-height:18px;font-size:13px;margin-bottom:6px}
  /* диалог */
  dialog{border:1px solid var(--border);border-radius:10px;padding:0;min-width:320px}
  dialog form{padding:16px}
  dialog h3{margin:0 0 12px;font-size:15px;word-break:break-word}
  dialog input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:inherit}
  .dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  /* диалог общих ссылок */
  #dlgShare>div{padding:16px;max-width:560px}
  #dlgShare h3{margin:0 0 4px}
  #dlgShare .note{color:var(--muted);font-size:12px;margin:0 0 10px}
  #shareLinks{max-height:50vh;overflow:auto}
  .slink{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eceff2;flex-wrap:wrap}
  .slink:first-child{border-top:none}
  .slink .url{flex:1;min-width:160px;font:12px ui-monospace,Consolas,"Courier New",monospace;overflow-wrap:anywhere}
  .slink a,.slink button{font-size:12px;padding:3px 8px;text-decoration:none;line-height:1.5}
  .slink a{color:var(--text);border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer}
  .slink a:hover{background:#f0f2f5}
  .no-links{color:var(--muted);font-size:13px;padding:6px 0}
  .mini{color:var(--muted);font-size:11px}

  /* строка состояния удаления: прогресс + отмена */
  #delBar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:55;
          width:min(720px,calc(100vw - 24px));background:#fff;border:1px solid var(--border);
          border-radius:10px;box-shadow:0 6px 24px rgba(16,22,26,.18);padding:10px 14px}
  #delBar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #delBar .ic{font-size:16px}
  #delBar .txt{flex:1;min-width:170px;overflow-wrap:anywhere;line-height:1.35}
  #delBar .mini2{color:var(--muted);font-size:12px}
  #delBar button{padding:4px 10px;font-size:12px}
  #delBar button.danger{color:var(--danger)}
  #delBar .pbar{height:6px;border-radius:3px;background:#eceff2;margin-top:8px;overflow:hidden}
  #delBar .pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  #delBar.done .pbar i{background:#1a7f37}
  #delBar.cancel .pbar i{background:#bf8700}
  #delBar.err .pbar i{background:var(--danger)}
  #delBar.scanning .pbar i{animation:delScan 1.3s ease-in-out infinite}
  @keyframes delScan{0%{margin-left:0}50%{margin-left:65%}100%{margin-left:0}}
  body.has-delbar #toast{bottom:112px}

/* ---- мобильная версия: строки-карточки, без горизонтального скролла ---- */
@media (max-width:640px){
  body{font-size:15px}
  main{padding:10px}
  header{padding:8px 10px;gap:8px}
  header .brand{font-size:16px}
  .crumbs{min-width:40px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #q{min-width:0;flex:1 1 100%;order:9}
  header button{padding:5px 10px}
  /* на мобильном заголовки не прячем — это панель сортировки */
  thead{display:block}
  thead tr{display:flex;flex-wrap:wrap;gap:6px;background:transparent;border:none;border-radius:0;padding:0;margin:0 0 8px;grid-template-areas:none}
  thead th{display:block;background:#fff;border:1px solid var(--border);border-radius:8px;padding:5px 10px;
           font-size:12px;text-transform:none;letter-spacing:0;white-space:nowrap}
  thead th:nth-child(4){display:none}
  thead th.on{border-color:var(--accent);background:#e8f0fe;color:var(--accent)}
  table, tbody{display:block;border:none;background:transparent}
  #tbl{border:none}
  tr{display:grid;grid-template-areas:"name acts" "size date";grid-template-columns:minmax(0,1fr) auto;
     gap:2px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 8px}
  td{border:none;padding:0}
  tr > td:nth-child(1){grid-area:name;min-width:0}
  tr > td:nth-child(2){grid-area:size;font-size:12px;color:var(--muted);text-align:left}
  tr > td:nth-child(3){grid-area:date;font-size:12px;color:var(--muted);text-align:right}
  tr > td:nth-child(4){grid-area:acts}
  .nm{display:flex;width:100%;max-width:100%}
  .nm .ic{flex:0 0 auto;font-size:17px}
  .nm span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sub{margin-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:44vw}
  .acts button,.acts a{padding:3px 7px;font-size:12px}
  dialog{min-width:0;max-width:calc(100vw - 20px)}
  tbody tr:hover{background:#fff}
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <h1>☁️ Облако</h1>
  <p>Вход по логину и паролю</p>
  <form id="loginForm">
    <input type="text" id="user" placeholder="Логин" autofocus autocomplete="username">
    <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button type="submit" class="primary" style="width:100%">Войти</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">☁️ Облако</div>
    <select id="diskSel" title="Диск"></select>
    <span id="diskInfo" class="mini"></span>
    <div class="crumbs" id="crumbs"></div>
    <input id="q" placeholder="Поиск по имени и содержимому…" autocomplete="off">
    <button id="btnIndex" title="Обновить индекс поиска">⟳ Индекс</button>
    <button id="btnUpload" title="Загрузить файлы в текущую папку">⬆ Загрузить</button>
    <button id="btnFolder">＋ Папка</button>
    <button id="btnShares" title="Все общие ссылки">🔗 Ссылки</button>
    <button id="btnLogout">Выход</button>
  </header>
  <main>
    <div id="note" class="note hidden"></div>
    <div id="empty" class="empty hidden"></div>
    <table id="tbl" class="hidden">
      <thead><tr>
        <th class="sortable" data-sort="name" title="Сортировать по имени: 1-й клик — по возрастанию, 2-й — по убыванию, 3-й — порядок по умолчанию">Имя<span class="ar"></span></th>
        <th class="sortable num" data-sort="size" title="Сортировать по размеру (папки — всегда сверху)">Размер<span class="ar"></span></th>
        <th class="sortable num" data-sort="mtime" id="thDate" title="Сортировать по дате изменения"><span class="lbl">Изменён</span><span class="ar"></span></th>
        <th style="width:330px"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <input type="file" id="fileInput" multiple class="hidden">
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <input id="dlgInput" autocomplete="off">
    <div class="dlg-btns">
      <button type="button" id="dlgCancel">Отмена</button>
      <button type="button" id="dlgOk" class="primary">OK</button>
    </div>
  </form>
</dialog>

<dialog id="dlgShare">
  <div>
    <h3 id="dlgShareTitle"></h3>
    <p class="note" id="dlgShareNote"></p>
    <div id="shareLinks"></div>
    <div class="dlg-btns">
      <button type="button" id="dlgShareAdd" class="primary">＋ Новая ссылка</button>
      <button type="button" id="dlgShareClose">Закрыть</button>
    </div>
  </div>
</dialog>

<div id="delBar" class="hidden">
  <div class="row">
    <span class="ic" id="delIcon">⏳</span>
    <div class="txt"><div id="delTitle"></div><div class="mini2" id="delSub"></div></div>
    <button id="delCancel" class="danger">Отменить</button>
    <button id="delClose" class="hidden" title="Скрыть">✕</button>
  </div>
  <div class="pbar"><i id="delProg"></i></div>
</div>

<div id="prog"><div class="bar" id="progBar"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const S = { cur: "", search: null, busy: false, view: "browse" };
/* «диски» приходят с сервера: GET /api/disks (список из config.json + место и тип носителя).
   Элемент: {rel, name, type, total, used, free}; rel — виртуальный корень в хранилище. */
let DISKS = [{ rel: "", name: "Облако" }];
function diskOf(rel){
  rel = rel || "";
  let best = null;                 // самый длинный подходящий префикс (диски могут быть вложены)
  for (const d of DISKS)
    if (d.rel === rel || (d.rel && rel.startsWith(d.rel + "/")))
      if (!best || d.rel.length > best.rel.length) best = d;
  return best || DISKS[0];
}
function diskBrief(d){
  const parts = [];
  if (d.type) parts.push(d.type);
  if (d.total) parts.push(fmtSize(d.total));
  return parts.join(" · ");
}
function renderDiskInfo(d){
  const el = $("diskInfo");
  el.textContent = d.total
    ? `${d.type || ""} · занято ${fmtSize(d.used)} из ${fmtSize(d.total)} · свободно ${fmtSize(d.free)}`
    : (diskBrief(d) || "нет данных");
}
function humanRel(rel){
  const d = diskOf(rel);
  if (!d.rel) return rel;
  const rest = rel.length > d.rel.length ? rel.slice(d.rel.length + 1) : "";
  return d.name + (rest ? " › " + rest : "");
}

/* ---------- утилиты ---------- */
function fmtSize(n){
  if (n == null) return "";
  if (n < 1024) return n + " Б";
  const u = ["КБ","МБ","ГБ","ТБ"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 1 : 0) + " " + u[i];
}
function fmtDate(ts){
  const d = new Date(ts * 1000), p = x => String(x).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function iconOf(name, isDir){
  if (isDir) return "📁";
  const e = (name.split(".").pop() || "").toLowerCase();
  if (["png","jpg","jpeg","gif","webp","svg","bmp","heic"].includes(e)) return "🖼";
  if (["mp4","mkv","avi","mov","webm","m4v"].includes(e)) return "🎬";
  if (["mp3","wav","flac","ogg","m4a","aac"].includes(e)) return "🎵";
  if (e === "pdf") return "📕";
  if (["zip","rar","7z","tar","gz","bz2","xz"].includes(e)) return "🗜";
  if (["py","js","ts","html","css","json","c","cpp","h","java","go","rs","sh","sql","yaml","yml","toml","md","txt","log","xml","csv"].includes(e)) return "📄";
  return "📄";
}
function toast(msg, isErr){
  const t = $("toast");
  t.textContent = msg;
  t.className = isErr ? "err" : "";
  t.style.opacity = 1;
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.opacity = 0, 3500);
}
function setNote(text){ $("note").textContent = text || ""; $("note").classList.toggle("hidden", !text); }
function copyText(t){
  const done = () => toast("Ссылка скопирована");
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Ссылка скопирована"); }
    catch (e) { prompt("Скопируй ссылку вручную (Ctrl+C):", t); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(done, fallback);
  else fallback();
}
function fullUrl(path){ return location.origin + path; }

/* ---------- api ---------- */
async function api(url, opts = {}){
  const r = await fetch(url, opts);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401) { showLogin(); throw new Error("Требуется вход"); }
  if (!r.ok) throw new Error((data && data.error) || ("Ошибка " + r.status));
  return data;
}
function post(url, body){
  return api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

/* ---------- диалог «спросить строку» ---------- */
function ask(title, placeholder, value = ""){
  return new Promise(resolve => {
    $("dlgTitle").textContent = title;
    $("dlgInput").value = value;
    $("dlgInput").placeholder = placeholder || "";
    const done = v => { $("dlg").close(); resolve(v); };
    $("dlgOk").onclick = () => done($("dlgInput").value.trim() || null);
    $("dlgCancel").onclick = () => done(null);
    $("dlgInput").onkeydown = e => { if (e.key === "Enter") done($("dlgInput").value.trim() || null); };
    $("dlg").showModal();
    $("dlgInput").focus();
    $("dlgInput").select();
  });
}

/* ---------- навигация и отрисовка ---------- */
function renderCrumbs(){
  const box = $("crumbs");
  box.textContent = "";
  const cur = diskOf(S.cur);          // текущий диск — для селектора и подписи места
  $("diskSel").value = cur.rel;
  renderDiskInfo(cur);
  if (S.view === "shares") {
    const a = document.createElement("a");
    a.textContent = "☁️ Облако";
    a.href = "#";
    a.onclick = e => { e.preventDefault(); loadDir(""); };
    box.appendChild(a);
    box.appendChild(Object.assign(document.createElement("span"), { className: "sep", textContent: "›" }));
    box.appendChild(Object.assign(document.createElement("span"), { textContent: "🔗 Ссылки" }));
    return;
  }
  if (S.search) {
    const a = document.createElement("a");
    a.textContent = "✕ Поиск: «" + S.search.q + "»";
    a.title = "Вернуться в папку";
    a.onclick = () => { S.search = null; $("q").value = ""; loadDir(S.cur); };
    box.appendChild(a);
    return;
  }
  const parts = S.cur ? S.cur.split("/") : [];
  let acc = "";
  const add = (label, path) => {
    const a = document.createElement("a");
    a.textContent = label;
    a.onclick = e => { e.preventDefault(); loadDir(path); };
    box.appendChild(a);
    if (path !== S.cur) box.appendChild(Object.assign(document.createElement("span"), { className: "sep", textContent: "›" }));
  };
  const disk = cur, base = disk.rel;
  const rest = base ? (S.cur === base ? [] : S.cur.slice(base.length + 1).split("/")) : parts;
  add(disk.name, base);
  acc = base;
  for (const p of rest) { acc = acc ? acc + "/" + p : p; add(p, acc); }
}

/* ---------- сортировка списка (клик по заголовку столбца) ---------- */
/* SORT = null — порядок с сервера (для поиска — по релевантности); иначе {key,dir} */
function loadSort(){
  try {
    const v = JSON.parse(localStorage.getItem("cloud.sort") || "null");
    if (v && ["name", "size", "mtime"].includes(v.key) && (v.dir === 1 || v.dir === -1)) return v;
  } catch (e) {}
  return null;
}
function saveSort(){
  try {
    if (SORT) localStorage.setItem("cloud.sort", JSON.stringify(SORT));
    else localStorage.removeItem("cloud.sort");
  } catch (e) {}
}
let SORT = loadSort();

/* dateKey — поле с датой: у листинга mtime, у общих ссылок created */
function sortItems(items, dateKey = "mtime"){
  if (!SORT || items.length < 2) return items.slice();
  const key = SORT.key === "mtime" ? dateKey : SORT.key, dir = SORT.dir;
  const cmp = (a, b) => {
    let r;
    if (key === "name") r = String(a.name).localeCompare(String(b.name), "ru", { numeric: true, sensitivity: "base" });
    else if (key === "size") r = (a.size == null ? -1 : a.size) - (b.size == null ? -1 : b.size);
    else r = (a[key] || 0) - (b[key] || 0);
    return r * dir;
  };
  const dirs = [], files = [];        // папки всегда сверху — как в проводнике
  for (const it of items) (it.type === "dir" ? dirs : files).push(it);
  dirs.sort(cmp); files.sort(cmp);
  return dirs.concat(files);
}

function setHeaderSort(){
  for (const th of document.querySelectorAll("#tbl thead th.sortable")){
    const on = !!SORT && th.dataset.sort === SORT.key;
    th.classList.toggle("on", on);
    th.querySelector(".ar").textContent = on ? (SORT.dir === 1 ? "\u25b2" : "\u25bc") : "";
  }
}
function clickSort(key){
  if (!SORT || SORT.key !== key) SORT = { key: key, dir: 1 };
  else if (SORT.dir === 1) SORT = { key: key, dir: -1 };
  else SORT = null;                   // третий клик — снова порядок по умолчанию
  saveSort(); setHeaderSort(); refresh();
}
function setDateCol(label, title){
  const th = $("thDate");
  th.querySelector(".lbl").textContent = label;
  if (title) th.title = title;
}

function makeRow(item, inSearch){
  const tr = document.createElement("tr");
  const tdName = document.createElement("td");
  const a = document.createElement("a");
  a.className = "nm";
  const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = iconOf(item.name, item.type === "dir");
  const tx = document.createElement("span"); tx.textContent = item.name;
  a.appendChild(ic); a.appendChild(tx);
  if (item.type === "dir") {
    a.href = "#";
    a.title = item.name;
    a.onclick = e => { e.preventDefault(); loadDir(item.rel); };
  } else {
    a.href = "/api/file?path=" + encodeURIComponent(item.rel);
    a.target = "_blank"; a.rel = "noopener";
    a.title = item.name;
  }
  tdName.appendChild(a);
  if (inSearch) {
    const sub = document.createElement("div");
    sub.className = "sub"; sub.textContent = "…/" + humanRel(item.rel);
    tdName.appendChild(sub);
  }
  tr.appendChild(tdName);

  const tdSize = document.createElement("td");
  tdSize.className = "num"; tdSize.textContent = item.type === "dir" ? "" : fmtSize(item.size);
  tr.appendChild(tdSize);

  const tdM = document.createElement("td");
  tdM.className = "num"; tdM.textContent = item.mtime ? fmtDate(item.mtime) : "";
  tr.appendChild(tdM);

  const tdA = document.createElement("td");
  const acts = document.createElement("div"); acts.className = "acts";
  const btn = (label, cls, fn) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = e => { e.stopPropagation(); fn(); };
    acts.appendChild(b);
    return b;
  };
  const exp = document.createElement("a");
  exp.textContent = "📂";
  exp.title = "Показать в проводнике Windows (диск Z:)";
  exp.href = "cloudopen:" + item.rel.split("/").map(encodeURIComponent).join("/");
  acts.appendChild(exp);
  const sh = btn("🔗", null, () => shareDialog(item));
  sh.title = "Общая ссылка — просмотр без входа";
  btn("⬇", null, () => location.href = "/api/download?path=" + encodeURIComponent(item.rel));
  btn("Переим.", null, rename);
  btn("Перенести", null, move);
  btn("Удалить", "del", del);
  tdA.appendChild(acts);
  tr.appendChild(tdA);

  function rename(){
    ask("Переименовать «" + item.name + "»", "новое имя", item.name).then(v => {
      if (!v || v === item.name) return;
      post("/api/rename", { path: item.rel, name: v }).then(refresh).catch(e => toast(e.message, true));
    });
  }
  function move(){
    ask("Переместить «" + item.name + "» — в какую папку?", "путь от корня, напр. comp/docs (пусто = корень)").then(v => {
      if (v === null) return;
      post("/api/move", { path: item.rel, dest: v }).then(refresh).catch(e => toast(e.message, true));
    });
  }
  function del(){
    const q = item.type === "dir"
      ? "Удалить папку «" + item.name + "» со всем содержимым?" : "Удалить файл «" + item.name + "»?";
    if (!confirm(q)) return;
    delStart(item);
  }
  return tr;
}

function render(items){
  renderCrumbs();
  const rows = $("rows");
  rows.textContent = "";
  const empty = $("empty"), tbl = $("tbl");
  if (!items.length) {
    tbl.classList.add("hidden");
    empty.classList.remove("hidden");
    empty.textContent = S.search ? "Ничего не найдено" : "Папка пуста";
    $("btnUpload").classList.toggle("hidden", !!S.search);
    $("btnFolder").classList.toggle("hidden", !!S.search);
    return;
  }
  empty.classList.add("hidden");
  tbl.classList.remove("hidden");
  for (const it of sortItems(items)) rows.appendChild(makeRow(it, !!S.search));
  $("btnUpload").classList.toggle("hidden", !!S.search);
  $("btnFolder").classList.toggle("hidden", !!S.search);
}

async function loadDir(path){
  S.cur = path || ""; S.search = null; S.view = "browse"; $("q").value = "";
  headerBrowse(true);
  setDateCol("Изменён", "Сортировать по дате изменения");
  setNote("");
  S.busy = true;
  try {
    const data = await api("/api/list?path=" + encodeURIComponent(path || ""));
    render(data.items);
  } catch (e) { if (e.message !== "Требуется вход") toast(e.message, true); }
  finally { S.busy = false; }
}

async function runSearch(){
  const q = $("q").value.trim();
  if (!q || S.busy) return;
  S.busy = true;
  const t0 = Date.now();
  const timer = setInterval(() => setNote(`Ищу… ${Math.round((Date.now() - t0) / 1000)} с`), 1000);
  try {
    const data = await api("/api/search?q=" + encodeURIComponent(q) + "&path=" + encodeURIComponent(S.cur || ""));
    S.search = { q };
    setNote(data.note || "");
    render(data.items);
  } catch (e) { if (e.message !== "Требуется вход") toast(e.message, true); }
  finally { clearInterval(timer); S.busy = false; }
}
function refresh(){
  if (S.view === "shares") { loadShares(); return; }
  if (S.search) { $("q").value = S.search.q; runSearch(); }
  else loadDir(S.cur);
}

/* ---------- загрузка файлов ---------- */
function uploadFiles(list){
  if (!list.length || S.search) return;
  const fd = new FormData();
  for (const f of list) fd.append("files", f);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload?path=" + encodeURIComponent(S.cur || ""));
  const bar = $("progBar");
  bar.style.width = "0%";
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) bar.style.width = Math.round(e.loaded * 100 / e.total) + "%";
  };
  xhr.onload = () => {
    bar.style.width = "0%";
    if (xhr.status === 401) { showLogin(); return; }
    let data = null; try { data = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status >= 200 && xhr.status < 300) {
      toast("Загружено файлов: " + (data && data.uploaded != null ? data.uploaded : list.length));
      refresh();
    } else toast((data && data.error) || ("Ошибка " + xhr.status), true);
  };
  xhr.onerror = () => { bar.style.width = "0%"; toast("Ошибка сети", true); };
  xhr.send(fd);
}

/* ---------- общие ссылки ---------- */
function headerBrowse(on){
  $("q").classList.toggle("hidden", !on);
  $("btnIndex").classList.toggle("hidden", !on);
  $("btnUpload").classList.toggle("hidden", !on);
  $("btnFolder").classList.toggle("hidden", !on);
}

/* список дисков с сервера (место/тип) + селектор в шапке */
async function loadDisks(){
  try {
    const d = await api("/api/disks");
    if (d.disks && d.disks.length) DISKS = d.disks;
  } catch (e) { /* сервер не ответил — остаётся фолбэк */ }
  buildDiskSel();
}
function buildDiskSel(){
  const sel = $("diskSel");
  sel.textContent = "";
  for (const d of DISKS){
    const o = document.createElement("option");
    o.value = d.rel;
    o.textContent = d.name + (diskBrief(d) ? " — " + diskBrief(d) : "");
    sel.appendChild(o);
  }
  sel.onchange = () => {
    if (S.busy){ sel.value = diskOf(S.cur).rel; return; }
    loadDir(sel.value);
  };
  renderDiskInfo(diskOf(S.cur));
}

async function loadShares(){
  S.view = "shares"; S.search = null; S.cur = "";
  $("q").value = "";
  headerBrowse(false);
  setNote("");
  setDateCol("Создана", "Сортировать по дате создания ссылки");
  $("tbl").classList.add("hidden");
  $("empty").classList.remove("hidden");
  $("empty").textContent = "Загружаю ссылки…";
  S.busy = true;
  try {
    const data = await api("/api/shares");
    drawShares(data.shares);
  } catch (e) { if (e.message !== "Требуется вход") toast(e.message, true); }
  finally { S.busy = false; }
}

function drawShares(list){
  renderCrumbs();
  const rows = $("rows");
  rows.textContent = "";
  const empty = $("empty"), tbl = $("tbl");
  if (!list.length) {
    tbl.classList.add("hidden");
    empty.classList.remove("hidden");
    empty.textContent = "Нет ни одной ссылки — нажми 🔗 у файла или папки";
    return;
  }
  empty.classList.add("hidden");
  tbl.classList.remove("hidden");
  for (const s of sortItems(list, "created")) {
    const tr = document.createElement("tr");

    const tdName = document.createElement("td");
    const gone = s.type === "missing";
    const a = document.createElement("a");
    a.className = "nm";
    const ic = document.createElement("span"); ic.className = "ic";
    ic.textContent = gone ? "❓" : iconOf(s.name, s.type === "dir");
    const tx = document.createElement("span");
    tx.textContent = gone ? (s.rel.split("/").pop() || s.rel) + " (удалён)" : s.name;
    a.appendChild(ic); a.appendChild(tx);
    if (s.rel && !gone) {
      a.href = "#";
      a.title = "Перейти к папке, где лежит объект";
      a.onclick = e => {
        e.preventDefault();
        const parent = s.rel.split("/").slice(0, -1).join("/");
        loadDir(parent);
      };
    }
    tdName.appendChild(a);
    if (s.rel) {
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = "…/" + humanRel(s.rel);
      tdName.appendChild(sub);
    }
    tr.appendChild(tdName);

    const tdSize = document.createElement("td");
    tdSize.className = "num";
    tdSize.textContent = gone || s.type === "dir" ? "" : fmtSize(s.size);
    tr.appendChild(tdSize);

    const tdM = document.createElement("td");
    tdM.className = "num";
    tdM.textContent = s.created ? fmtDate(s.created) : "";
    tr.appendChild(tdM);

    const tdA = document.createElement("td");
    const acts = document.createElement("div"); acts.className = "acts";
    const b = (label, cls, fn) => {
      const x = document.createElement("button");
      x.textContent = label;
      if (cls) x.className = cls;
      x.onclick = e => { e.stopPropagation(); fn(); };
      acts.appendChild(x);
      return x;
    };
    b("Копировать", null, () => copyText(fullUrl(s.url)));
    if (!gone) {
      const o = document.createElement("a");
      o.textContent = "Открыть";
      o.href = s.url; o.target = "_blank"; o.rel = "noopener";
      o.title = "Открыть как гость (в новой вкладке)";
      acts.appendChild(o);
    }
    b("Закрыть", "del", () => revokeShare(s, tr));
    tdA.appendChild(acts);
    tr.appendChild(tdA);
    rows.appendChild(tr);
  }
}

async function revokeShare(s, tr){
  if (!confirm("Закрыть доступ по ссылке на «" + (s.name || s.rel) + "»?")) return;
  try {
    await post("/api/share/revoke", { token: s.token });
    toast("Доступ закрыт");
    loadShares();
  } catch (e) { toast(e.message, true); }
}

function shareDialog(item){
  const d = $("dlgShare");
  $("dlgShareTitle").textContent = "«" + item.name + "»";
  $("dlgShareNote").textContent = item.type === "dir"
    ? "Доступ по ссылке, без входа. Видны все вложенные файлы и папки; ссылка переживает переименование и перенос."
    : "Файл открывается у любого, у кого есть ссылка (без входа).";
  $("dlgShareAdd").onclick = async () => {
    try {
      await post("/api/share", { path: item.rel });
      toast("Ссылка создана");
    } catch (e) { toast(e.message, true); }
    loadLinks(item);
  };
  $("dlgShareClose").onclick = () => d.close();
  d.showModal();
  loadLinks(item);
}

async function loadLinks(item){
  const box = $("shareLinks");
  try {
    const data = await api("/api/share?path=" + encodeURIComponent(item.rel));
    box.textContent = "";
    if (!data.links.length) {
      box.appendChild(Object.assign(document.createElement("div"),
        { className: "no-links", textContent: "Ссылок пока нет." }));
      return;
    }
    for (const l of data.links) {
      const div = document.createElement("div");
      div.className = "slink";
      const urlEl = document.createElement("div");
      urlEl.className = "url";
      urlEl.textContent = fullUrl(l.url);
      div.appendChild(urlEl);
      const bCopy = document.createElement("button");
      bCopy.textContent = "Копировать";
      bCopy.onclick = () => copyText(urlEl.textContent);
      div.appendChild(bCopy);
      const aOpen = document.createElement("a");
      aOpen.textContent = "Открыть";
      aOpen.href = l.url; aOpen.target = "_blank"; aOpen.rel = "noopener";
      aOpen.title = "Открыть как гость";
      div.appendChild(aOpen);
      const bDel = document.createElement("button");
      bDel.textContent = "Закрыть доступ";
      bDel.className = "del";
      bDel.onclick = async () => {
        if (!confirm("Закрыть доступ по этой ссылке?")) return;
        try {
          await post("/api/share/revoke", { token: l.token });
          toast("Доступ закрыт");
          loadLinks(item);
        } catch (e) { toast(e.message, true); }
      };
      div.appendChild(bDel);
      box.appendChild(div);
    }
  } catch (e) {
    box.textContent = "";
    box.appendChild(Object.assign(document.createElement("div"),
      { className: "no-links", textContent: "Не удалось загрузить ссылки: " + e.message }));
  }
}

/* ---------- удаление: строка состояния с прогрессом и отменой ---------- */
let DEL = { id: 0, timer: null, hideH: null };

function fmtNum(n){ return Number(n || 0).toLocaleString("ru-RU"); }
function fmtDur(sec){
  if (sec == null || !isFinite(sec)) return "?";
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + " с";
  const m = Math.round(sec / 60);
  if (m < 60) return m + " мин";
  return Math.floor(m / 60) + " ч " + (m % 60) + " мин";
}

function delStart(item){
  clearTimeout(DEL.hideH);
  post("/api/delete", { path: item.rel })
    .then(r => { if (r.job){ DEL.id = r.job.id; showDelBar(r.job); } startDelPoll(); })
    .catch(e => toast(e.message, true));
}
function startDelPoll(){
  if (!DEL.timer) DEL.timer = setInterval(delTick, 700);
  delTick();
}
function stopDelPoll(){ clearInterval(DEL.timer); DEL.timer = null; }

async function delTick(){
  let s;
  try { s = await api("/api/delete/status"); }
  catch (e) { stopDelPoll(); return; }
  if (s.job && (s.active || !DEL.id || s.job.id === DEL.id)) showDelBar(s.job);
  if (!s.active){
    stopDelPoll();
    clearTimeout(DEL.hideH);
    DEL.hideH = setTimeout(delHide, 20000);   // результат держим 20 с
    if (s.job) refresh();
  }
}

async function delCancel(){
  if (!confirm("Отменить удаление? Уже удалённые файлы вернуть нельзя —\nостальное останется на месте.")) return;
  const b = $("delCancel");
  b.disabled = true; b.textContent = "Останавливаю…";
  try { await post("/api/delete/cancel", {}); }
  catch (e) { toast(e.message, true); }
  delTick();
}

function delHide(){
  stopDelPoll();
  clearTimeout(DEL.hideH);
  DEL.id = 0;
  $("delBar").classList.add("hidden");
  document.body.classList.remove("has-delbar");
}

/* Строка «идёт удаление»: рисуется по снимку операции с сервера. */
function showDelBar(j){
  const bar = $("delBar");
  bar.classList.remove("hidden");
  document.body.classList.add("has-delbar");

  const active = !!j.active, scan = j.phase === "scan";
  bar.classList.remove("done", "cancel", "err", "scanning");
  if (scan) bar.classList.add("scanning");
  else if (!active) bar.classList.add(j.phase === "done" ? "done" : (j.phase === "cancelled" ? "cancel" : "err"));

  const where = humanRel(j.rel), prog = $("delProg");
  let icon = "⚠️", title = "", sub = "";
  if (scan){
    icon = "🔍";
    title = "Подсчёт размера: " + where;
    sub = "найдено " + fmtNum(j.scanned_files) + " файлов · " + fmtSize(j.scanned_bytes);
    prog.style.width = "35%";
  } else if (j.phase === "delete"){
    icon = "🗑";
    title = "Удаление: " + where + " — " + j.percent + "%";
    sub = fmtSize(j.done_bytes) + " из " + fmtSize(j.total_bytes)
        + " · осталось " + fmtSize(j.left_bytes)
        + (j.eta != null ? " · ≈" + fmtDur(j.eta) : "")
        + " · файлов " + fmtNum(j.done_files) + " из " + fmtNum(j.total_files);
    prog.style.width = j.percent + "%";
  } else if (j.phase === "done"){
    if (j.errors){
      icon = "⚠️";
      title = "Удалено не полностью: " + where;
      sub = "удалено " + fmtSize(j.done_bytes) + " из " + fmtSize(j.total_bytes)
          + " · ошибок " + fmtNum(j.errors)
          + (j.left_files ? " · осталось файлов " + fmtNum(j.left_files) : "");
      prog.style.width = j.percent + "%";
    } else {
      icon = "✅";
      title = "Удалено: " + where;
      sub = fmtSize(j.done_bytes) + " · файлов " + fmtNum(j.done_files)
          + (j.total_dirs ? " · папок " + fmtNum(j.total_dirs) : "");
      prog.style.width = "100%";
    }
  } else if (j.phase === "cancelled"){
    icon = "⏹";
    title = "Удаление отменено: " + where;
    sub = "удалено " + fmtSize(j.done_bytes) + " из " + fmtSize(j.total_bytes)
        + (j.total_files ? " (" + j.percent + "%, файлов " + fmtNum(j.done_files)
                           + " из " + fmtNum(j.total_files) + ")" : "")
        + " · осталось на диске " + fmtSize(j.left_bytes);
    prog.style.width = j.percent + "%";
  } else {
    title = "Не удалось удалить: " + where;
    sub = j.error || (j.error_msgs && j.error_msgs[0]) || ("ошибок: " + fmtNum(j.errors));
    prog.style.width = j.percent + "%";
  }
  $("delIcon").textContent = icon;
  $("delTitle").textContent = title;
  $("delSub").textContent = sub;
  bar.title = (j.error_msgs && j.error_msgs.length)
    ? "Не удалось удалить:\n" + j.error_msgs.slice(0, 5).join("\n") : "";
  const c = $("delCancel");
  c.classList.toggle("hidden", !active);
  c.disabled = !!j.cancelled;
  c.textContent = j.cancelled ? "Останавливаю…" : "Отменить";
  $("delClose").classList.toggle("hidden", active);
}

/* Если удаление идёт (страницу перезагрузили) — показать строку и продолжить опрос. */
async function delResume(){
  try {
    const s = await api("/api/delete/status");
    if (s.active && s.job){ DEL.id = s.job.id; showDelBar(s.job); startDelPoll(); }
  } catch (e) { /* нет статуса — просто не показываем */ }
}

$("delCancel").onclick = delCancel;
$("delClose").onclick = delHide;

/* ---------- вход/выход ---------- */
function showLogin(){
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("pw").focus();
}
function showApp(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
}
async function init(){
  try {
    await api("/api/me");
    showApp();
    await loadDisks();
    await loadDir("");
    delResume();
  } catch (e) { showLogin(); }
}

/* ---------- события ---------- */
$("loginForm").onsubmit = async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    await post("/api/login", { user: $("user").value, password: $("pw").value });
    $("pw").value = "";
    showApp();
    await loadDisks();
    await loadDir("");
    delResume();
  } catch (err) { $("loginErr").textContent = err.message; }
};
$("btnLogout").onclick = async () => { try { await post("/api/logout", {}); } catch (e) {} showLogin(); };
$("q").onkeydown = e => { if (e.key === "Enter") runSearch(); };
for (const th of document.querySelectorAll("#tbl thead th.sortable"))
  th.onclick = () => clickSort(th.dataset.sort);
setHeaderSort();
$("btnUpload").onclick = () => $("fileInput").click();
$("fileInput").onchange = () => { uploadFiles($("fileInput").files); $("fileInput").value = ""; };
$("btnFolder").onclick = async () => {
  const name = await ask("Новая папка в «" + (S.cur || "Облако") + "»", "имя папки");
  if (name) post("/api/folder", { path: S.cur, name }).then(refresh).catch(e => toast(e.message, true));
};
$("btnShares").onclick = () => {
  if (S.busy) return;
  if (S.view === "shares") loadDir("");
  else loadShares();
};
// индекс: кнопка обновления + ожидание завершения
$("btnIndex").onclick = async () => {
  try {
    const r = await post("/api/index/sync", {});
    toast(r.started ? "Обновление индекса запущено" : "Индексация уже идёт…");
    const t = setInterval(async () => {
      try {
        const s = await api("/api/index");
        if (!s.running) {
          clearInterval(t);
          toast(s.errors ? "Индекс обновлён, ошибок: " + s.errors : "Индекс обновлён: " + s.files + " файлов", !!s.errors);
        }
      } catch (e) { clearInterval(t); }
    }, 2500);
  } catch (e) { toast(e.message, true); }
};

// drag & drop всей страницей
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  if ($("app").classList.contains("hidden")) return;
  uploadFiles(e.dataTransfer.files);
});

init();
</script>
